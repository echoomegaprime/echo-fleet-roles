<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Echo Reverse Engineering plugin icon">

<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
</defs>

<defs>
  <linearGradient id="bg" x1="48" y1="24" x2="464" y2="488" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#061615"/><stop offset="1" stop-color="#063D38"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="38%" r="60%">
    <stop offset="0" stop-color="#45E0C1" stop-opacity="0.34"/><stop offset="1" stop-color="#45E0C1" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#grid)"/>
<circle cx="256" cy="220" r="205" fill="url(#halo)"/>
<path d="M96 160 C132 76 210 48 256 48 C302 48 380 76 416 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="5" stroke-linecap="round"/>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M325 146 A132 132 0 1 0 367 337" stroke="#F4FFFC" stroke-width="18"/>
  <path d="M319 111 L331 154 L288 166" stroke="#45E0C1" stroke-width="18" filter="url(#glow)"/>
  <circle cx="244" cy="250" r="76" fill="#031211" stroke="#45E0C1" stroke-width="15"/>
  <path d="M244 205 V295 M199 250 H289 M213 219 L275 281 M275 219 L213 281" stroke="#F4FFFC" stroke-opacity="0.92" stroke-width="11"/>
  <path d="M298 304 L385 391" stroke="#F4FFFC" stroke-width="24"/>
  <path d="M117 219 H160 M117 281 H160 M329 219 H374 M329 281 H374" stroke="#45E0C1" stroke-width="11"/>
  <circle cx="111" cy="219" r="9" fill="#45E0C1" stroke="none"/><circle cx="111" cy="281" r="9" fill="#45E0C1" stroke="none"/>
  <circle cx="381" cy="219" r="9" fill="#45E0C1" stroke="none"/><circle cx="381" cy="281" r="9" fill="#45E0C1" stroke="none"/>
</g>
<path d="M176 430 C205 450 230 458 256 458 C282 458 307 450 336 430" fill="none" stroke="#45E0C1" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
</svg>