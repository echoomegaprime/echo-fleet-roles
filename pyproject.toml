[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-fleet-roles"
version = "1.0.0"
description = "Certified role packs and same-session role switching for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "ECHO OMEGA PRIME", email = "bobbymcwilliams@echo-op.com"}]
dependencies = []

[project.scripts]
echo-role = "echo_fleet_roles.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo_fleet_roles = ["data/*.json"]
